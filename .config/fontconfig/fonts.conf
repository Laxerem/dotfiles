<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Глобальный шрифт по умолчанию -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Sans</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrains Mono</string>
    </edit>
    <edit name="size" mode="assign" binding="strong">
      <double>11</double>
    </edit>
  </match>

  <!-- Исключение для Chromium -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrains Mono</string>
    </test>
    <test name="application" qual="any">
      <string>Chromium</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Sans</string>
    </edit>
    <edit name="size" mode="assign" binding="strong">
      <double>10</double>
    </edit>
  </match>

  <!-- Исключение для VS Code -->
  <match target="pattern">
    <test name="application" qual="any">
      <string>code</string> <!-- название приложения VS Code -->
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrains Mono</string>
    </edit>
    <edit name="size" mode="assign" binding="strong">
      <double>8</double> <!-- уменьшенный размер -->
    </edit>
  </match>

</fontconfig>
