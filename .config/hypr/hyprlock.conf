# Экран блокировки с обычным фоном (без эффекта).
# Фон и эффект выбираются во вкладке «Экран блокировки» приложения «Обои».
source = ~/.config/hypr/lockscreen.conf

background {
    monitor =
    path = $lock_bg
    blur_passes = 3
    blur_size = 2
    noise = 0.02
    contrast = 1.1
    brightness = 0.9
}

source = ~/.config/hypr/hyprlock-widgets.conf
