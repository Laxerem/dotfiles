# Общая часть экрана блокировки: часы, дата, поле ввода, раскладка, анимации.
# Подключается из hyprlock.conf (обычный фон) и hyprlock-fx.conf (фон с эффектом).
general {
    hide_cursor = true
    immediate_render = true   # не ждать загрузки ресурсов — показываемся сразу
}

animations {
    enabled = true
    bezier = smoothOut, 0.25, 0.1, 0.25, 1
    bezier = smoothInOut, 0.45, 0, 0.55, 1
    bezier = linear, 0, 0, 1, 1

    animation = fadeIn, 1, 6, smoothOut           # появление часов и поля ввода (600 мс)
    animation = fadeOut, 1, 4, smoothInOut        # исчезновение после ввода пароля (400 мс)
    animation = inputFieldDots, 1, 2, smoothOut
    animation = inputFieldWidth, 1, 3, smoothOut
    animation = inputFieldColors, 1, 4, linear
    animation = inputFieldFade, 1, 3, smoothOut
}


input-field {
    monitor =
    size = 280, 56
    position = 0, -100
    halign = center
    valign = center

    fade_on_empty = true
    dots_center = true
    dots_size = 0.3
    dots_spacing = 0.4

    rounding = 12
    outline_thickness = 2

    outer_color = rgba(255, 255, 255, 0.24)
    inner_color = rgba(0, 0, 0, 0.47)
    font_color  = rgba(255, 255, 255, 0.9)
    check_color = rgba(120, 200, 255, 0.63)
    fail_color  = rgba(255, 100, 100, 0.71)

    placeholder_text = <i>Enter Password</i>
    fail_text = <i>$FAIL</i>
    font_family = monospace

    shadow_passes = 2
    shadow_size = 6
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = JetBrains Mono ExtraBold
    position = 0, 160
    halign = center
    valign = center
    color = rgba(255, 255, 255, 1.0)
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    position = 0, 70
    halign = center
    valign = center
    color = rgba(255, 255, 255, 0.63)
}

# Текущая раскладка под полем ввода (клик — переключить)
shape {
    monitor =
    size = 52, 30
    rounding = 15
    color = rgba(0, 0, 0, 0.47)
    border_size = 2
    border_color = rgba(255, 255, 255, 0.24)
    position = 0, -165
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,RU]
    font_size = 12
    font_family = JetBrains Mono ExtraBold
    color = rgba(255, 255, 255, 0.9)
    position = 0, -165
    halign = center
    valign = center
    zindex = 1
    onclick = hyprctl switchxkblayout all next
}
