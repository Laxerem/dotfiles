[general]
destination = "$HOME/.config/hypr/monitors.conf"

[power_events]
[power_events.dbus_query_object]
path = "/org/freedesktop/UPower/devices/line_power_ACAD"

[[power_events.dbus_signal_match_rules]]
object_path = "/org/freedesktop/UPower/devices/line_power_ACAD"

# Профиль: только ноутбук
[[profiles]]
name = "laptop-only"

[[profiles.outputs]]
match = "eDP-1"
enable = true

# Профиль: два монитора
[[profiles]]
name = "dual-monitor"

[[profiles.outputs]]
match = "eDP-1"
enable = true
position = "0x0"

[[profiles.outputs]]
match = "HDMI-A-1"
enable = true
position = "1920x0"
